services:
  postgres:
    image: postgres:16-alpine
    container_name: hamster-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-hamster}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-hamster}
      POSTGRES_DB: ${POSTGRES_DB:-hamster}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hamster} -d ${POSTGRES_DB:-hamster}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
