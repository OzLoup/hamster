<!DOCTYPE html>
<html lang="es" class="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}{{ app_name }}{% endblock %}</title>
    <meta name="color-scheme" content="dark" />
    {% include "partials/head_assets.html" %}
    {% block head %}{% endblock %}
</head>
<body class="min-h-screen bg-surface-950 font-sans text-slate-100 antialiased" style="background-image: var(--surface-shell);">
    <header class="sticky top-0 z-20 border-b border-slate-800/80 bg-surface-950/70 backdrop-blur-xl">
        <div class="flex h-16 items-center justify-between px-4 sm:px-6 lg:px-8">
            <div class="flex items-center gap-3">
                <span class="inline-flex h-10 w-10 shrink-0 items-center justify-center rounded-2xl bg-gradient-to-br from-teal-500 to-brand-600 text-sm font-bold text-white shadow-lg shadow-teal-500/25">H</span>
                <div>
                    <p class="text-xs uppercase tracking-[0.18em] text-teal-300/80">Hamster</p>
                    <h1 class="font-display text-sm font-semibold text-slate-100 sm:text-base">Panel de administración</h1>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <span class="hidden sm:inline-flex items-center gap-2 rounded-xl border border-emerald-500/40 bg-emerald-500/10 px-3 py-2 text-xs font-semibold text-emerald-200">
                    <span class="h-2 w-2 rounded-full bg-emerald-300 animate-pulse"></span>
                    {{ current_user.full_name }}
                </span>
                <button
                    id="logout-button"
                    type="button"
                    class="saas-btn saas-btn-muted rounded-xl px-3 py-2 text-xs"
                    aria-label="Cerrar sesión"
                >
                    Cerrar sesión
                </button>
            </div>
        </div>
    </header>

    <main class="saas-page-fade mx-auto max-w-6xl px-4 pb-10 pt-6 sm:px-6 lg:px-8">
        {% block content %}{% endblock %}
    </main>

    <div id="toast-container" class="pointer-events-none fixed right-4 top-4 z-[100] flex w-full max-w-sm flex-col gap-3" aria-live="polite" aria-atomic="true"></div>

    <script>
        window.currentUser = { id: {{ current_user.id|tojson }}, isSuperuser: true };
    </script>
    <script src="{{ url_for('static', path='/js/toast.js') }}"></script>
    <script type="module" src="{{ url_for('static', path='/js/auth/logout.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
